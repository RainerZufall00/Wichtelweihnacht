services:
  wichtel:
    build: .
    image: humberger-wichtel:latest
    container_name: wichtel
    restart: unless-stopped
    environment:
      # Öffentliche Adresse: für den Admin-Link im Log und das Vorschaubild in WhatsApp & Co.
      PUBLIC_URL: https://wichteln.example.de
      # Hinter Pangolin: echte Besucher-IP für die Rate-Limits verwenden.
      # Nur sicher, solange der Port NICHT öffentlich erreichbar ist (siehe "ports" unten).
      TRUST_PROXY: "1"
      # Optional: eigenes Admin-Geheimnis (mind. 24 Zeichen), sonst wird eins erzeugt:
      #   openssl rand -base64 24 | tr '+/' '-_'
      # ADMIN_TOKEN: ...
    volumes:
      - wichtel-data:/data

    # ---------- Härtung: der Container darf so gut wie nichts ----------
    read_only: true                 # Dateisystem schreibgeschützt (nur /data beschreibbar)
    tmpfs:
      - /tmp:size=4m,noexec,nosuid,nodev
    cap_drop: [ALL]                 # keine Linux-Capabilities
    security_opt:
      - no-new-privileges:true      # keine Rechteausweitung
    user: "65532:65532"             # nie als root
    pids_limit: 64
    mem_limit: 160m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

    # ---------- Netzwerk ----------
    # Eigenes, isoliertes Netz – NIEMALS ins Netz des Mailservers hängen.
    networks: [wichtel]
    # Variante A: Port nur auf localhost; Pangolin/Newt zeigt auf http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    # Variante B (statt A): nur ins Netz von Newt/Pangolin, dann "ports" und "wichtel"-Netz
    # entfernen und als Ziel http://wichtel:3000 eintragen:
    # networks: [pangolin]

volumes:
  wichtel-data:

networks:
  wichtel:
    driver: bridge
#  pangolin:
#    external: true
