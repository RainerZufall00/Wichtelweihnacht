services:
  wichtel:
    build: .
    image: humberger-wichtel:latest
    container_name: wichtel
    restart: unless-stopped
    environment:
      # Kommt aus der Datei .env (Vorlage: .env.example)
      # Öffentliche Adresse: für den Admin-Link im Log und das Vorschaubild in WhatsApp & Co.
      PUBLIC_URL: ${PUBLIC_URL:?Bitte PUBLIC_URL in .env setzen, z.B. https://wichteln.deine-domain.de}
      # Optional: eigenes Admin-Geheimnis (mind. 24 Zeichen), sonst wird eins erzeugt
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Hinter Pangolin: echte Besucher-IP für die Rate-Limits verwenden.
      # Sicher, weil der Container keinen Port nach außen öffnet (nur über das Pangolin-Netz erreichbar).
      TRUST_PROXY: "1"
    volumes:
      - wichtel-data:/data

    # ---------- Härtung: der Container darf so gut wie nichts ----------
    read_only: true                 # Dateisystem schreibgeschützt (nur /data beschreibbar)
    tmpfs:
      - /tmp:size=4m,noexec,nosuid,nodev
    cap_drop: [ALL]                 # keine Linux-Capabilities
    security_opt:
      - no-new-privileges:true      # keine Rechteausweitung
    user: "65532:65532"             # nie als root
    pids_limit: 64
    mem_limit: 160m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

    # ---------- Netzwerk ----------
    # Kein "ports:" – der Container ist von außen NICHT erreichbar, nur für Pangolin.
    # In Pangolin als Ziel eintragen: http://wichtel:3000
    # NIEMALS ins Netz des Mailservers hängen.
    networks: [pangolin]

volumes:
  wichtel-data:

networks:
  pangolin:
    external: true
    # Name des Docker-Netzes, in dem Pangolin (bzw. Traefik/Newt) hängt – prüfen mit: docker network ls
    name: ${PANGOLIN_NETWORK:-pangolin}
